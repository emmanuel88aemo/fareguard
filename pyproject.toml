[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fareguard"
version = "0.1.0"
description = "A spend-gated operations agent on Amazon Bedrock AgentCore whose rules are enforced outside the model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fareguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax
    "B",       # bugbear
    "S",       # security (bandit)
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",
    "ANN",     # every function is annotated
    "D",       # docstrings
]
ignore = [
    "D203", "D213",  # conflict with D211/D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]  # asserts are the point of tests; test names document themselves

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=fareguard --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
show_missing = true
