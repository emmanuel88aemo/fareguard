[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fareguard"
version = "0.1.0"
description = "A spend-gated operations agent on Amazon Bedrock AgentCore whose rules are enforced outside the model."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs[dynamodb]>=1.35",
    "moto[dynamodb]>=5.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fareguard"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax
    "B",       # bugbear
    "S",       # security (bandit)
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "RUF",
    "ANN",     # every function is annotated
    "D",       # docstrings
    "C90",     # cyclomatic complexity
    "PL",      # pylint: argument counts, branches, statements
    "BLE",     # no blind except
    "ARG",     # no unused arguments
    "ERA",     # no commented-out code
    "PTH",     # pathlib over os.path
    "T20",     # no print in library code
    "TRY",     # exception handling
]
ignore = [
    "D203", "D213",  # conflict with D211/D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]  # asserts and literal expectations are the point of tests
"scripts/**" = ["T20"]  # command-line scripts report through stdout and stderr

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 8
max-returns = 4
max-statements = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "--strict-markers --strict-config --cov=fareguard --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
show_missing = true
